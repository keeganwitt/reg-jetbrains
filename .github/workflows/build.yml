name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and package
        shell: pwsh
        run: |
          if ($IsWindows) { ./gradlew.bat test buildPlugin --console=plain }
          else { bash ./gradlew test buildPlugin --console=plain }
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: build/reports/tests/test
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.os }}
          path: build/distributions/*.zip

  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew verifyPlugin --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-reports
          path: build/reports/pluginVerifier
